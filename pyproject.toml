[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-disease-prediction"
version = "1.0.0"
description = "Early cardiovascular disease prediction from clinical records and cardiac MRI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.2",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "shap>=0.44"]
mri = ["torch>=2.1", "nibabel>=5.0"]
dev = ["pytest>=7.4"]

[project.scripts]
cardiac-eda = "cardiac.tabular.eda:main"
cardiac-train = "cardiac.tabular.train:main"
cardiac-mri-preprocess = "cardiac.mri.preprocess:main"
cardiac-mri-train = "cardiac.mri.train:main"
cardiac-mri-baseline = "cardiac.mri.metrics_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
